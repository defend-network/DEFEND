name: DEFEND Website CI

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  push:
    branches:
      - rebuild/website-platform-v1
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"

permissions:
  contents: read

concurrency:
  group: defend-website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  verify:
    name: Verify website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verify D1 migrations
        run: npm run db:verify

      - name: Production dependency scan
        run: npm run audit:prod -- --audit-level=high

      - name: Next.js build
        run: npm run build

      - name: OpenNext Worker build
        run: npm run build:worker

  deploy-staging:
    name: Deploy staging Worker
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/website-platform-v1' && vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://defend-website-staging.owner-e75.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify DEFEND deployment identity
        env:
          DEFEND_GITHUB_ACCOUNT: ${{ vars.DEFEND_GITHUB_ACCOUNT }}
          DEFEND_CLOUDFLARE_ACCOUNT_ID: ${{ vars.DEFEND_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUIRE_DEFEND_IDENTITY: "true"
        run: npm run verify:identity

      - name: Apply staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --env staging

      - name: Build Worker
        run: npm run build:worker

      - name: Deploy to Cloudflare staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy --env staging
